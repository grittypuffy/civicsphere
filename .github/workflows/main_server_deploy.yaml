name: Build and Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "backend/src/**"


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
    - name: Check out the code
      uses: actions/checkout@v2

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_SP }}
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to ACR
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}


    - name: Build and push Docker image for Backend
      run: |
        docker build --push -f ./backend/Dockerfile -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.PROJECT_NAME }}-backend:latest ./backend

    - name: Deploy backend to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_APP_SERVICE_BE }}
        images: |
          ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.PROJECT_NAME }}-backend:latest