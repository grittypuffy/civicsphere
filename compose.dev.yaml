services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile.dev
    volumes:
      - ../certs:/certs:ro
      - ../uploads:/backend/uploads
    develop:
      watch:
        - action: sync
          path: ./backend/
          target: /backend
          ignore:
            - __pycache__/
            - "*.pyc"
            - "*.pyo"
            - "*.pyd"
            - .git/
            - .pytest_cache/
            - .coverage
        - action: rebuild
          path: ./backend/poetry.lock
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/pyproject.toml
    environment:
      - MONGODB_URI=mongodb://root:root@mongodb:27017/civicsphere?authSource=admin
      - TMP_UPLOADS_DIR=/backend/uploads
    env_file:
      - ./backend/.env
    networks:
      - network

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile.dev
      args:
        NEXT_PUBLIC_BACKEND_URL: http://backend:8000
    volumes:
      - ../certs:/certs:ro
    develop:
      watch:
        - action: sync
          path: ./frontend/
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
            - "*.log"
            - .env.local
            - .env.*.local
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/yarn.lock
        - action: rebuild
          path: ./frontend/next.config.js
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - network

  nginx:
    image: nginx:alpine
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/localhost.pem:/etc/ssl/certs/localhost.pem:ro
      - ./certs/localhost-key.pem:/etc/ssl/private/localhost-key.pem:ro
    depends_on:
      - frontend
      - backend
    networks:
      - network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - network

volumes:
  mongo-data:

networks:
  network:
    driver: bridge
