[project]
name = "civicsphere"
version = "0.1.0"
description = ""
authors = [
    {name = "Keerthana",email = "grittypuffy@riseup.net"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.121.2,<0.122.0)",
    "pydantic[email] (>=2.12.4,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "azure-core (>=1.36.0,<2.0.0)",
    "langchain (>=1.0.7,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-openai (>=1.0.3,<2.0.0)",
    "ffmpeg-python (>=0.2.0,<0.3.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "azure-cognitiveservices-speech (>=1.47.0,<2.0.0)",
    "azure-storage-blob (>=12.27.1,<13.0.0)",
    "azure-ai-formrecognizer (>=3.3.3,<4.0.0)",
    "azure-search (>=1.0.0b2,<2.0.0)",
    "azure-search-documents (>=11.6.0,<12.0.0)",
    "azure-identity (>=1.25.1,<2.0.0)",
    "azure-ai-evaluation (>=1.13.7,<2.0.0)",
    "azure-ai-textanalytics (>=5.3.0,<6.0.0)",
    "azure-ai-generative (>=1.0.0b11,<2.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "usaddress (>=0.5.16,<0.6.0)"
]

[tool.poetry]
packages = [{include = "civicsphere", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
